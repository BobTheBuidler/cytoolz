[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools >=77",
  "cython >=0.29",
  "setuptools-git-versioning >=2.0",
]

[project]
name = "cytoolz"
dynamic = ["version"]
description = "Cython implementation of Toolz: High performance functional utilities"
readme = "README.rst"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Erik Welch", email = "erik.n.welch@gmail.com" },
  { name = "CyToolz contributors" },
]
maintainers = [
  { name = "Erik Welch", email = "erik.n.welch@gmail.com" },
]
keywords = [
  "functional",
  "utility",
  "itertools",
  "functools",
  "iterator",
  "generator",
  "curry",
  "memoize",
  "lazy",
  "streaming",
  "bigdata",
  "cython",
  "toolz",
  "cytoolz",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Cython",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python :: Free Threading :: 1 - Unstable",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "toolz >= 0.8.0",
]

[project.optional-dependencies]
cython = ["cython >=0.29"]
test = ["pytest"]

[project.urls]
homepage = "https://github.com/pytoolz/cytoolz"
repository = "https://github.com/pytoolz/cytoolz"
documentation = "https://toolz.readthedocs.io/en/latest/"
changelog = "https://github.com/pytoolz/cytoolz/releases"

[tool.setuptools]
packages = [
  "cytoolz",
  "cytoolz.curried",
  "cytoolz.tests",
]

[tool.setuptools.package-data]
cytoolz = ["*.pyi", "py.typed", "curried/*.pyi"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}+{ccount}.g{sha}"
dirty_template = "{tag}+{ccount}.g{sha}.dirty"

[tool.cibuildwheel]
test-requires = ["pytest", "toolz"]
test-command = "python -m pytest --pyargs cytoolz"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["cytoolz"]
xfail_strict = true
addopts = [
  "--strict-config",  # Force error if config is mispelled
  "--strict-markers", # Force error if marker is mispelled (must be defined in config)
  "-ra",              # Print summary of all fails/errors
]
log_cli_level = "info"
filterwarnings = [
  "error",
  "ignore:The toolz.compatibility module is no longer needed:DeprecationWarning:",
]

[tool.mypy]
strict = true
show_error_codes = true
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
  "comparison-overlap",
  "deprecated",
  "explicit-any",
  "explicit-override",
  "exhaustive-match",
  "ignore-without-code",
  "mutable-override",
  "no-any-return",
  "no-any-unimported",
  "no-untyped-call",
  "no-untyped-def",
  "possibly-undefined",
  "redundant-cast",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "type-arg",
  "unimported-reveal",
  "unreachable",
  "unused-awaitable",
  "unused-ignore",
  "untyped-decorator",
]
files = ["cytoolz/*.pyi", "cytoolz/curried/*.pyi"]
