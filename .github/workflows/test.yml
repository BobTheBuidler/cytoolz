name: tests

on:
  push:
    paths:
      - '**/*.py'
      - '**/*.pyi'
      - 'pyproject.toml'
      - 'mypy.ini'
      - 'setup.cfg'
      - 'setup.py'
      - 'requirements*.txt'
      - 'tox.ini'
      - 'poetry.lock'
      - '.pre-commit-config.yaml'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.pyi'
      - 'pyproject.toml'
      - 'mypy.ini'
      - 'setup.cfg'
      - 'setup.py'
      - 'requirements*.txt'
      - 'tox.ini'
      - 'poetry.lock'
      - '.pre-commit-config.yaml'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/test.yml'
  schedule:
  - cron: 0 0 * * 1

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            os: ubuntu-latest
          - python-version: '3.10'
            os: ubuntu-latest
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
          - python-version: '3.9'
            os: macos-latest
          - python-version: '3.12'
            os: macos-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install -U pip
        python -m pip install -r requirements.txt
        python -m pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        python -m pytest --cov=cytoolz --cov-report=xml

    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml

    - name: Run mypy
      run: python -m mypy cytoolz
